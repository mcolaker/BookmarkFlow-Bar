name: Feature request
description: Propose a focused improvement to BookmarkFlow Bar
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Review the public [roadmap](https://github.com/mcolaker/BookmarkFlow-Bar/blob/main/ROADMAP.md) and [governance model](https://github.com/mcolaker/BookmarkFlow-Bar/blob/main/GOVERNANCE.md) first. Use [GitHub Discussions](https://github.com/mcolaker/BookmarkFlow-Bar/discussions) when an idea still needs exploration; open an issue when the problem and expected outcome are actionable.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the workflow or limitation before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe how the feature should behave from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you evaluated.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project fit
      options:
        - label: The proposal can preserve BookmarkFlow's local-first privacy model.
          required: true
        - label: I reviewed the public roadmap and contribution governance.
          required: true
        - label: I searched existing issues and did not find the same request.
          required: true
