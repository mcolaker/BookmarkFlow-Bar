<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookmarkFlow Bar</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="topline">
        <div>
          <h1>BookmarkFlow</h1>
          <p>Yer imi ust bari</p>
        </div>
        <label class="switch" title="Ust bari ac veya kapat">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <button id="openOnboarding" class="primary setup-button" type="button">Kurulum rehberi</button>

      <label class="check" title="Normal web sitelerinde kucuk BF panelini gosterir; yeni sekme sayfasini etkilemez">
        <input id="showOnSites" type="checkbox">
        <span>Web sitelerinde goster</span>
      </label>

      <section class="control">
        <span class="label">Satir</span>
        <div class="segments" role="group" aria-label="Satir sayisi">
          <button type="button" data-rows="1">1</button>
          <button type="button" data-rows="2">2</button>
          <button type="button" data-rows="3">3</button>
          <button type="button" data-rows="4">4</button>
        </div>
      </section>

      <label class="check" title="Daha fazla yer imini daha az alanda gosterir">
        <input id="compact" type="checkbox">
        <span>Yogun gorunum</span>
      </label>

      <label class="check">
        <input id="offsetPage" type="checkbox">
        <span>Sayfayi asagi it</span>
      </label>

      <label class="check">
        <input id="showSearch" type="checkbox">
        <span>Kalici arama</span>
      </label>

      <label class="check" title="Arama paleti bosken yer imlerini listelemez">
        <input id="hideEmptySearchSuggestions" type="checkbox">
        <span>Bos aramada onerileri gizle</span>
      </label>

      <label class="check" title="Yayin ve sunum icin yer imi isimlerini ikon moduna alir">
        <input id="streamerMode" type="checkbox">
        <span>Yayinci modu</span>
      </label>

      <section class="control">
        <span class="label">Klasor rayi</span>
        <div class="segments segments-three" role="group" aria-label="Klasor rayi konumu">
          <button type="button" data-folder-rail="off">Kapali</button>
          <button type="button" data-folder-rail="left">Sol</button>
          <button type="button" data-folder-rail="right">Sag</button>
        </div>
      </section>

      <label class="check" title="Istege bagli: giris, odeme ve banka sayfalarinda bari gizler">
        <input id="autoHideSensitiveSites" type="checkbox">
        <span>Giris/odeme sayfalarinda gizle</span>
      </label>

      <label class="check" title="WordPress, TradingView gibi sabit ust panel kullanan sayfalarda genis bari alta alir">
        <input id="avoidAppTopBars" type="checkbox">
        <span>Cakisan ust panellerde alta al</span>
      </label>

      <section id="siteControl" class="site-control" hidden>
        <span id="siteHost" class="label">Bu site</span>
        <button id="toggleSite" class="secondary" type="button">Bu sitede gizle</button>
        <p id="siteStatus" class="status"></p>
      </section>

      <section class="shortcuts" aria-labelledby="shortcutsTitle">
        <div class="shortcut-head">
          <span id="shortcutsTitle" class="label">Kisayollar</span>
          <button id="manageShortcuts" class="link-button" type="button">Duzenle</button>
        </div>
        <dl class="shortcut-list">
          <div class="shortcut-row" data-command="open-search">
            <dt>Arama paleti</dt>
            <dd><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>E</kbd></dd>
          </div>
          <div class="shortcut-row" data-command="toggle-bar">
            <dt>Bari ac / daralt</dt>
            <dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>B</kbd></dd>
          </div>
          <div class="shortcut-row" data-command="hide-restore">
            <dt>Gizle / geri getir</dt>
            <dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>H</kbd></dd>
          </div>
          <div class="shortcut-row" data-command="toggle-streamer-mode">
            <dt>Yayinci modu</dt>
            <dd><kbd>Alt</kbd><kbd>Shift</kbd><kbd>M</kbd></dd>
          </div>
          <div class="shortcut-row">
            <dt>Chrome yer imleri</dt>
            <dd><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>O</kbd></dd>
          </div>
        </dl>
      </section>

      <button id="openBookmarkMaintenance" class="secondary" type="button">Ayni adli klasorleri birlestir</button>
      <button id="resetPosition" class="secondary subtle" type="button">Konumu sifirla</button>
    </main>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
